<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBV Download - Tải Video & Audio Trực Tiếp</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: { pink: '#ff007f', purple: '#7928ca', cyan: '#00dfd8' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00dfd8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-brand-pink selection:text-white">

    <header class="w-full border-b border-white/10 glass-card sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-pink via-brand-purple to-brand-cyan flex items-center justify-center text-white font-extrabold text-xl shadow-lg">
                    T
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider gradient-text">TBV DOWNLOAD</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">Bản quyền thuộc Táo Bắc Việt Team</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full flex flex-col items-center">
        <div class="text-center mb-8 space-y-4">
            <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight">
                Tải Trực Tiếp <span class="gradient-text">Video & MP3</span>
            </h2>
            <p class="text-slate-400 text-sm">Tự động xử lý và tải file trực tiếp qua Vercel Serverless Backend</p>
        </div>

        <div id="downloader" class="w-full glass-card p-6 md:p-8 rounded-3xl shadow-2xl relative overflow-hidden border border-white/10">
            <form id="downloadForm" onsubmit="handleAnalyze(event)" class="space-y-4">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-link absolute left-4 text-slate-400 text-lg"></i>
                    <input 
                        type="url" 
                        id="mediaUrl" 
                        required
                        placeholder="Dán link YouTube (ví dụ: https://www.youtube.com/watch?v=...)" 
                        class="w-full bg-slate-900/90 border border-white/10 rounded-2xl py-4 pl-12 pr-36 text-sm md:text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-pink transition"
                    >
                    <button type="submit" class="absolute right-2 px-6 py-2.5 rounded-xl bg-gradient-to-r from-brand-pink via-brand-purple to-brand-cyan font-bold text-white text-sm glow-btn">
                        Phân tích
                    </button>
                </div>
            </form>

            <div id="loading" class="hidden py-8 text-center space-y-3">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-brand-pink border-t-transparent"></div>
                <p id="loadingStatus" class="text-slate-400 text-sm font-semibold animate-pulse">Đang phân tích liên kết media...</p>
            </div>

            <div id="resultCard" class="hidden mt-8 pt-8 border-t border-white/10 space-y-6">
                <div class="flex flex-col md:flex-row gap-6 items-center bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                    <div class="w-full md:w-1/2 rounded-xl overflow-hidden aspect-video bg-black flex items-center justify-center relative shadow-lg">
                        <div id="playerContainer" class="w-full h-full flex items-center justify-center"></div>
                    </div>
                    <div class="w-full md:w-1/2 space-y-3">
                        <span id="platformBadge" class="px-3 py-1 text-[10px] font-bold tracking-wider uppercase rounded-md bg-brand-pink/20 text-brand-pink border border-brand-pink/30">YouTube Media</span>
                        <h3 id="mediaTitle" class="font-bold text-lg line-clamp-2 text-slate-100">Tiêu đề Video</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="directDownload('mp4')" class="flex justify-between items-center p-4 rounded-xl bg-brand-pink/10 hover:bg-brand-pink/20 border border-brand-pink/30 transition group">
                        <span class="text-sm font-bold text-brand-pink"><i class="fa-solid fa-video mr-2"></i> Tải Video MP4 Trực Tiếp</span>
                        <i class="fa-solid fa-download text-brand-pink group-hover:scale-110 transition"></i>
                    </button>
                    <button onclick="directDownload('mp3')" class="flex justify-between items-center p-4 rounded-xl bg-brand-cyan/10 hover:bg-brand-cyan/20 border border-brand-cyan/30 transition group">
                        <span class="text-sm font-bold text-brand-cyan"><i class="fa-solid fa-music mr-2"></i> Tải Âm Thanh MP3 Trực Tiếp</span>
                        <i class="fa-solid fa-download text-brand-cyan group-hover:scale-110 transition"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-slate-500 text-xs border-t border-white/5">
        &copy; 2026 TBV Download - Phát triển bởi Táo Bắc Việt Team
    </footer>

    <script>
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function handleAnalyze(e) {
            e.preventDefault();
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');

            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');

            setTimeout(() => {
                loading.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const playerContainer = document.getElementById('playerContainer');
                const mediaTitle = document.getElementById('mediaTitle');
                const ytId = getYouTubeId(urlInput);

                if (ytId) {
                    mediaTitle.innerText = `YouTube Video [ID: ${ytId}]`;
                    playerContainer.innerHTML = `<iframe class="w-full h-full rounded-xl" src="https://www.youtube.com/embed/${ytId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
                } else {
                    mediaTitle.innerText = "Nội dung Media";
                    playerContainer.innerHTML = `<i class="fa-solid fa-circle-play text-5xl text-brand-cyan"></i>`;
                }
            }, 500);
        }

        // HÀM GỌI ĐẾN BACKEND VERCEL ĐỂ TẢI FILE TỰ ĐỘNG
        function directDownload(format) {
            const mediaUrl = document.getElementById('mediaUrl').value.trim();
            if (!mediaUrl) {
                alert('Vui lòng nhập đường dẫn video!');
                return;
            }

            // Gọi đến Backend API Vercel tương đối (/api/download)
            const downloadEndpoint = `/api/download?url=${encodeURIComponent(mediaUrl)}&format=${format}`;
            
            // Tự động kích hoạt tải xuống trực tiếp trên trình duyệt
            window.location.href = downloadEndpoint;
        }
    </script>
</body>
</html>
